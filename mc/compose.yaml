services:
  mc:
    image: itzg/minecraft-server
    container_name: mc
    tty: true
    stdin_open: true
    restart: unless-stopped
    ports:
      - 25565:25565
    environment:
      EULA: "TRUE"
      VERSION: 1.21.4
      DIFFICULTY: normal
      TYPE: FABRIC
      MAX_MEMORY: 8G
      COPY_MODS_SRC: /mods
      DATAPACKS: /datapacks
      ONLINE_MODE: false
      PVP: false
      
    volumes:
      - ./mc_data:/data
      - ./mc_mods:/mods:ro
      - ./mc_datapacks:/datapacks:ro