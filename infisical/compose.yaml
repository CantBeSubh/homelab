version: "3"

services:
  backend:
    container_name: infisical-backend
    restart: always
    image: infisical/infisical:latest-postgres
    pull_policy: always
    ports:
      - 15080:8080

    environment:
      - NODE_ENV=${NODE_ENV}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - AUTH_SECRET=${AUTH_SECRET}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_CONNECTION_URI=${DB_CONNECTION_URI}
      - REDIS_URL=${REDIS_URL}
      - SITE_URL=${SITE_URL}
      - OTEL_TELEMETRY_COLLECTION_ENABLED=${OTEL_TELEMETRY_COLLECTION_ENABLED}
      - OTEL_EXPORT_TYPE=${OTEL_EXPORT_TYPE}
      - ENABLE_MSSQL_SECRET_ROTATION_ENCRYPT=${ENABLE_MSSQL_SECRET_ROTATION_ENCRYPT}
      - KUBERNETES_AUTO_FETCH_SERVICE_ACCOUNT_TOKEN=${KUBERNETES_AUTO_FETCH_SERVICE_ACCOUNT_TOKEN}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}